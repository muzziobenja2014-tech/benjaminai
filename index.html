<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>benjamin IA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #212121; /* Dark theme background */
            color: #ececec;
            margin: 0;
            overflow: hidden; /* Prevent body scroll, handle scrolling in components */
        }
        
        /* Custom Scrollbar for dark theme */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #424242;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        /* Input textarea auto-resize tweaks */
        textarea {
            resize: none;
            overflow-y: hidden;
        }
        textarea:focus {
            outline: none;
        }

        /* Markdown styling for chat messages */
        .prose pre {
            background-color: #0d0d0d;
            padding: 1rem;
            border-radius: 0.5rem;
            overflow-x: auto;
            margin-top: 0.5rem;
            margin-bottom: 0.5rem;
            border: 1px solid #333;
        }
        .prose code {
            font-family: monospace;
            background-color: rgba(255, 255, 255, 0.1);
            padding: 0.125rem 0.25rem;
            border-radius: 0.25rem;
            font-size: 0.875em;
            color: #ff7b72;
        }
        .prose pre code {
            background-color: transparent;
            padding: 0;
            color: #e6edf3;
        }
        .prose p {
            margin-bottom: 0.75rem;
        }
        .prose p:last-child {
            margin-bottom: 0;
        }
        .prose strong {
            font-weight: 600;
            color: #fff;
        }
        
        /* Typing animation */
        .typing-dot {
            animation: typing 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body class="h-screen flex flex-col md:flex-row">

    <!-- Sidebar -->
    <aside id="sidebar" class="w-full md:w-64 bg-[#171717] flex flex-col transition-all duration-300 absolute md:relative z-20 h-full -translate-x-full md:translate-x-0 border-r border-[#333]">
        <div class="p-4 flex items-center justify-between">
            <button id="new-chat-btn" class="flex-1 flex items-center gap-2 bg-[#212121] hover:bg-[#303030] transition-colors py-2.5 px-4 rounded-lg text-sm font-medium border border-[#333]">
                <i class="ph ph-plus text-lg"></i>
                Nuevo Chat
            </button>
            <button id="close-sidebar-btn" class="md:hidden ml-2 p-2 text-gray-400 hover:text-white">
                <i class="ph ph-x text-xl"></i>
            </button>
        </div>
        
        <div class="flex-1 overflow-y-auto p-3">
            <div class="text-xs font-semibold text-gray-500 mb-3 px-2">Hoy</div>
            <div class="space-y-1">
                <!-- Mock History Item -->
                <button class="w-full text-left flex items-center gap-2 px-3 py-2 rounded-lg bg-[#212121] text-sm text-gray-200 truncate">
                    <i class="ph ph-chat-teardrop-text"></i>
                    Conversación actual
                </button>
            </div>
        </div>

        <div class="p-4 border-t border-[#333] flex items-center gap-3 hover:bg-[#2a2a2a] cursor-pointer transition-colors">
            <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-purple-500 to-blue-500 flex items-center justify-center text-white font-bold text-sm">
                U
            </div>
            <div class="text-sm font-medium">Usuario</div>
        </div>
    </aside>

    <!-- Overlay for mobile sidebar -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-10 hidden md:hidden"></div>

    <!-- Main Chat Area -->
    <main class="flex-1 flex flex-col relative h-full max-w-full">
        <!-- Header (Mobile mostly) -->
        <header class="h-14 flex items-center px-4 border-b border-[#333] bg-[#212121] z-0 sticky top-0">
            <button id="open-sidebar-btn" class="md:hidden p-2 -ml-2 text-gray-400 hover:text-white">
                <i class="ph ph-list text-2xl"></i>
            </button>
            <h1 class="text-lg font-semibold ml-2 md:ml-0 flex items-center gap-2">
                benjamin IA
                <span class="text-xs bg-purple-500/20 text-purple-300 px-2 py-0.5 rounded-full border border-purple-500/30">Beta</span>
            </h1>
        </header>

        <!-- Chat Container -->
        <div id="chat-container" class="flex-1 overflow-y-auto scroll-smooth p-4 md:p-8 flex flex-col gap-6 relative">
            
            <!-- Welcome State -->
            <div id="welcome-screen" class="flex flex-col items-center justify-center h-full text-center px-4 fade-in">
                <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center mb-6 shadow-lg shadow-purple-500/20">
                    <i class="ph-fill ph-robot text-3xl text-white"></i>
                </div>
                <h2 class="text-3xl font-bold mb-2">Hola, soy benjamin IA</h2>
                <p class="text-gray-400 max-w-md mx-auto mb-8">
                    ¿En qué puedo ayudarte hoy? Puedes hacerme preguntas, pedirme que escriba código o simplemente charlar.
                </p>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3 max-w-2xl w-full">
                    <button class="suggestion-btn text-left p-4 rounded-xl border border-[#333] bg-[#2a2a2a] hover:bg-[#333] transition-colors">
                        <span class="block text-sm font-medium mb-1">Explícame la computación cuántica</span>
                        <span class="block text-xs text-gray-500">en términos sencillos</span>
                    </button>
                    <button class="suggestion-btn text-left p-4 rounded-xl border border-[#333] bg-[#2a2a2a] hover:bg-[#333] transition-colors">
                        <span class="block text-sm font-medium mb-1">Escribe un poema</span>
                        <span class="block text-xs text-gray-500">sobre el universo y las estrellas</span>
                    </button>
                    <button class="suggestion-btn text-left p-4 rounded-xl border border-[#333] bg-[#2a2a2a] hover:bg-[#333] transition-colors">
                        <span class="block text-sm font-medium mb-1">Dame ideas para cenar</span>
                        <span class="block text-xs text-gray-500">con ingredientes saludables</span>
                    </button>
                    <button class="suggestion-btn text-left p-4 rounded-xl border border-[#333] bg-[#2a2a2a] hover:bg-[#333] transition-colors">
                        <span class="block text-sm font-medium mb-1">Ayúdame con código HTML</span>
                        <span class="block text-xs text-gray-500">para crear un botón animado</span>
                    </button>
                </div>
            </div>

            <!-- Messages will be injected here -->
        </div>

        <!-- Input Area -->
        <div class="p-4 md:p-6 bg-gradient-to-t from-[#212121] via-[#212121] to-transparent shrink-0">
            <div class="max-w-3xl mx-auto relative">
                <form id="chat-form" class="relative flex items-end shadow-lg bg-[#2f2f2f] rounded-2xl border border-[#444] focus-within:border-gray-400 transition-colors">
                    <textarea 
                        id="message-input" 
                        rows="1" 
                        placeholder="Envía un mensaje a benjamin IA..." 
                        class="w-full max-h-48 py-4 pl-4 pr-12 bg-transparent text-white placeholder-gray-400 border-none rounded-2xl text-base"
                    ></textarea>
                    <button 
                        type="submit" 
                        id="send-btn"
                        class="absolute right-3 bottom-3 p-2 rounded-xl bg-white text-black hover:bg-gray-200 transition-colors disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center"
                        disabled
                    >
                        <i class="ph-fill ph-arrow-up text-lg"></i>
                    </button>
                </form>
                <div class="text-center text-xs text-gray-500 mt-2">
                    benjamin IA puede cometer errores. Considera verificar la información importante.
                </div>
            </div>
        </div>
    </main>

    <script>
        // --- State ---
        let chatHistory = [];
        let isGenerating = false;

        // --- DOM Elements ---
        const chatForm = document.getElementById('chat-form');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const chatContainer = document.getElementById('chat-container');
        const welcomeScreen = document.getElementById('welcome-screen');
        const suggestionBtns = document.querySelectorAll('.suggestion-btn');
        
        // Sidebar Mobile Elements
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebar-overlay');
        const openSidebarBtn = document.getElementById('open-sidebar-btn');
        const closeSidebarBtn = document.getElementById('close-sidebar-btn');
        const newChatBtn = document.getElementById('new-chat-btn');

        // --- API Configuration ---
        const apiKey = ""; // Left empty as per instructions, canvas provides it
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
        
        const systemInstruction = {
            parts: [{ text: "Actúa como un asistente de Inteligencia Artificial avanzado, amigable y muy útil llamado 'benjamin IA'. Fuiste creado para ayudar a las personas respondiendo preguntas, escribiendo código, redactando textos y resolviendo problemas de manera similar a Gemini o ChatGPT. Tus respuestas deben ser claras, concisas, bien estructuradas utilizando markdown (negritas, bloques de código, listas) y siempre en el idioma en el que el usuario te hable (principalmente español). Tienes una personalidad servicial e inteligente." }]
        };

        // --- UI Interactions ---

        // Auto-resize textarea
        messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
            if (this.scrollHeight > 192) { // Max height roughly
                this.style.overflowY = 'auto';
            } else {
                this.style.overflowY = 'hidden';
            }
            
            // Enable/disable send button
            if (this.value.trim().length > 0 && !isGenerating) {
                sendBtn.disabled = false;
            } else {
                sendBtn.disabled = true;
            }
        });

        // Handle Enter key to send (Shift+Enter for new line)
        messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                if (!sendBtn.disabled) {
                    chatForm.dispatchEvent(new Event('submit'));
                }
            }
        });

        // Mobile Sidebar toggles
        function toggleSidebar() {
            const isClosed = sidebar.classList.contains('-translate-x-full');
            if (isClosed) {
                sidebar.classList.remove('-translate-x-full');
                sidebarOverlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                sidebarOverlay.classList.add('hidden');
            }
        }
        openSidebarBtn.addEventListener('click', toggleSidebar);
        closeSidebarBtn.addEventListener('click', toggleSidebar);
        sidebarOverlay.addEventListener('click', toggleSidebar);

        // New Chat
        newChatBtn.addEventListener('click', () => {
            chatHistory = [];
            chatContainer.innerHTML = '';
            chatContainer.appendChild(welcomeScreen);
            welcomeScreen.style.display = 'flex';
            if(window.innerWidth < 768) toggleSidebar();
        });

        // Suggestion buttons
        suggestionBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const text = btn.querySelector('.text-sm').innerText;
                messageInput.value = text;
                messageInput.dispatchEvent(new Event('input'));
                chatForm.dispatchEvent(new Event('submit'));
            });
        });

        // --- Markdown Parser (Basic but effective for chat) ---
        function parseMarkdown(text) {
            // Escape HTML tags to prevent XSS
            let html = text.replace(/</g, '&lt;').replace(/>/g, '&gt;');
            
            // Code blocks: ```language\n code \n```
            html = html.replace(/```([a-z]*)\n([\s\S]*?)```/g, (match, lang, code) => {
                const language = lang ? `<div class="text-xs text-gray-400 mb-1 font-sans px-4 pt-2">${lang}</div>` : '';
                return `<pre class="my-3 rounded-lg bg-[#0d0d0d] border border-[#333] overflow-hidden">${language}<code class="block p-4 overflow-x-auto text-sm text-gray-200">${code}</code></pre>`;
            });
            
            // Inline code: `code`
            html = html.replace(/`([^`]+)`/g, '<code class="bg-[#333] text-[#ff7b72] px-1.5 py-0.5 rounded text-sm font-mono">$1</code>');
            
            // Bold: **text**
            html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            
            // Italic: *text*
            html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
            
            // Headings (H3 for simplicity in chat)
            html = html.replace(/^### (.*$)/gim, '<h3 class="text-lg font-bold mt-4 mb-2">$1</h3>');
            html = html.replace(/^## (.*$)/gim, '<h2 class="text-xl font-bold mt-4 mb-2">$1</h2>');
            html = html.replace(/^# (.*$)/gim, '<h1 class="text-2xl font-bold mt-4 mb-2">$1</h1>');
            
            // Lists (Basic unorderd)
            html = html.replace(/^\s*[-*]\s+(.*)$/gim, '<li class="ml-4 list-disc marker:text-gray-500">$1</li>');
            // Wrap consecutive lis in ul
            html = html.replace(/(<li.*<\/li>)\n/g, '$1'); 

            // Paragraphs & Line breaks
            html = html.split('\n\n').map(p => {
                if (p.startsWith('<pre') || p.startsWith('<h') || p.startsWith('<li')) return p;
                return `<p>${p.replace(/\n/g, '<br>')}</p>`;
            }).join('');

            return `<div class="prose prose-invert max-w-none text-gray-200 leading-relaxed">${html}</div>`;
        }

        // --- Chat Logic ---
        
        function addMessageToUI(role, text) {
            // Hide welcome screen on first message
            if (welcomeScreen.style.display !== 'none') {
                welcomeScreen.style.display = 'none';
            }

            const messageDiv = document.createElement('div');
            messageDiv.className = `flex gap-4 max-w-4xl mx-auto w-full group ${role === 'user' ? 'justify-end' : ''}`;
            
            let innerHTML = '';
            
            if (role === 'user') {
                innerHTML = `
                    <div class="bg-[#2f2f2f] text-white px-5 py-3.5 rounded-2xl rounded-br-sm max-w-[85%] break-words shadow-sm border border-[#3a3a3a]">
                        ${text.replace(/\n/g, '<br>')}
                    </div>
                `;
            } else {
                innerHTML = `
                    <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-600 flex-shrink-0 flex items-center justify-center mt-1">
                        <i class="ph-fill ph-robot text-white text-sm"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="font-semibold text-gray-200 mb-1 flex items-center gap-2">
                            benjamin IA
                        </div>
                        ${parseMarkdown(text)}
                        <div class="flex gap-2 mt-3 opacity-0 group-hover:opacity-100 transition-opacity">
                            <button class="copy-btn text-gray-400 hover:text-white p-1 rounded hover:bg-[#333] transition-colors" title="Copiar">
                                <i class="ph ph-copy"></i>
                            </button>
                        </div>
                    </div>
                `;
            }
            
            messageDiv.innerHTML = innerHTML;
            chatContainer.appendChild(messageDiv);
            
            // Add copy functionality to bot messages
            if (role === 'model') {
                const copyBtn = messageDiv.querySelector('.copy-btn');
                if (copyBtn) {
                    copyBtn.addEventListener('click', () => {
                        document.execCommand('copy');
                        const textArea = document.createElement("textarea");
                        textArea.value = text;
                        document.body.appendChild(textArea);
                        textArea.select();
                        try {
                            document.execCommand('copy');
                            copyBtn.innerHTML = '<i class="ph ph-check text-green-400"></i>';
                            setTimeout(() => copyBtn.innerHTML = '<i class="ph ph-copy"></i>', 2000);
                        } catch (err) {
                            console.error('Copy failed', err);
                        }
                        document.body.removeChild(textArea);
                    });
                }
            }
            
            scrollToBottom();
        }

        function showTypingIndicator() {
            const div = document.createElement('div');
            div.id = 'typing-indicator';
            div.className = `flex gap-4 max-w-3xl mx-auto w-full`;
            div.innerHTML = `
                <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-600 flex-shrink-0 flex items-center justify-center mt-1">
                    <i class="ph-fill ph-robot text-white text-sm"></i>
                </div>
                <div class="flex items-center gap-1 h-10 px-2">
                    <div class="w-2 h-2 rounded-full bg-gray-500 typing-dot"></div>
                    <div class="w-2 h-2 rounded-full bg-gray-500 typing-dot"></div>
                    <div class="w-2 h-2 rounded-full bg-gray-500 typing-dot"></div>
                </div>
            `;
            chatContainer.appendChild(div);
            scrollToBottom();
        }

        function removeTypingIndicator() {
            const indicator = document.getElementById('typing-indicator');
            if (indicator) indicator.remove();
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function handleSubmission(e) {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (!text || isGenerating) return;

            // Reset input UI
            messageInput.value = '';
            messageInput.style.height = 'auto';
            sendBtn.disabled = true;
            isGenerating = true;

            // Add user message
            addMessageToUI('user', text);
            chatHistory.push({ role: "user", parts: [{ text: text }] });

            showTypingIndicator();

            // Prepare payload for Gemini API
            const payload = {
                contents: chatHistory,
                systemInstruction: systemInstruction,
                generationConfig: {
                    temperature: 0.7,
                }
            };

            try {
                // Implement exponential backoff conceptually (single try here for simplicity but wrapped in error handling)
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const result = await response.json();
                
                removeTypingIndicator();

                if (result.candidates && result.candidates.length > 0 && result.candidates[0].content) {
                    const botText = result.candidates[0].content.parts[0].text;
                    
                    // Save to history
                    chatHistory.push({ role: "model", parts: [{ text: botText }] });
                    
                    // Render in UI
                    addMessageToUI('model', botText);
                } else {
                    addMessageToUI('model', "Lo siento, recibí una respuesta vacía o inesperada. ¿Puedes intentar de nuevo?");
                }

            } catch (error) {
                console.error("Error generating content:", error);
                removeTypingIndicator();
                addMessageToUI('model', "⚠️️ **Error de conexión.** Mis servidores (Gemini API) están experimentando problemas o la clave API no se resolvió correctamente. Por favor, intenta de nuevo en unos momentos.");
                // Remove the last user message from history so they can retry without breaking context format
                chatHistory.pop(); 
            } finally {
                isGenerating = false;
                if (messageInput.value.trim().length > 0) {
                    sendBtn.disabled = false;
                }
            }
        }

        chatForm.addEventListener('submit', handleSubmission);

        // Initial focus
        window.addEventListener('load', () => {
            messageInput.focus();
        });

    </script>
</body>
</html>
